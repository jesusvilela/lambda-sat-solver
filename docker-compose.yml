version: '3.8'

services:
  backend:
    build: .
    ports:
      - "5001:5001"
    volumes:
      - ./examples:/app/examples:ro
    environment:
      - FLASK_ENV=development
    command: python -m backend.api_server

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
    environment:
      - VITE_API_URL=http://localhost:5001
    depends_on:
      - backend
