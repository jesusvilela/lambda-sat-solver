[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lambda-sat-solver"
version = "0.1.0"
description = "Certified SAT middleware and frame-structured SAT hardness research harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Jesus Vilela Jato" }
]
keywords = [
  "SAT",
  "satisfiability",
  "CDCL",
  "DRAT",
  "proof-checking",
  "portfolio-solving",
  "SAT-hardness"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "pydantic>=2.0.0",
  "numpy>=1.24.0",
  "pycryptosat>=5.11.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0"
]
proof = []
bench = []

[project.urls]
Homepage = "https://github.com/jesusvilela/lambda-sat-solver"
Repository = "https://github.com/jesusvilela/lambda-sat-solver"
Issues = "https://github.com/jesusvilela/lambda-sat-solver/issues"

[project.scripts]
lambda-sat = "backend.cli:main_cli"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]