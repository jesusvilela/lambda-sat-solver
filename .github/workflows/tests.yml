name: tests

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  unit-fast:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -e .[dev]

      - name: Run test suite
        run: python -m pytest backend/tests/ -q

  certification-hard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -e .[dev]

      - name: Install SAT/proof tools
        run: |
          sudo apt-get update
          sudo apt-get install -y kissat drat-trim cadical
          command -v kissat
          command -v drat-trim

      - name: Run strict certification smoke tests
        run: |
          set +e
          python -m backend.cli examples/simple_sat.cnf --mode strict
          sat_code=$?
          python -m backend.cli examples/simple_unsat.cnf --mode strict
          unsat_code=$?
          test "$sat_code" -eq 10
          test "$unsat_code" -eq 20

      - name: Run full test suite with tools installed
        run: python -m pytest backend/tests/ -q
