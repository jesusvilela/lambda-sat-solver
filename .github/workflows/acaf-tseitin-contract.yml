name: ACAF λSAT beta-Tseitin contract

on:
  push:
    branches: [main, acaf-tseitin-transport]
  pull_request:

jobs:
  gate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bounded Tseitin unique extensions, beta free-variable loss
        run: python -m unittest backend.tests.test_acaf_tseitin_interop -v
